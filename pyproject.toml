[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "models", "data"]

[tool.ruff.lint]
select = [
    "B",    # bugbear: likely bugs
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "RUF",  # ruff-specific rules
    "SIM",  # simplifications
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# TF_CPP_MIN_LOG_LEVEL has to be set before TensorFlow is imported.
"scripts/stonky.py" = ["E402"]
# The tests stub out tensorflow/talib before importing the modules under test.
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
