name: Dependabot auto-merge

# Auto-merges Dependabot's minor/patch updates once CI is green.
# Requires "Allow auto-merge" to be enabled in the repository settings.
# Major version bumps are intentionally left for a human to review.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == '23skdu/STONKYSTONKS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Reminder for major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: echo "::notice::Major dependency update - manual review required before merging."
