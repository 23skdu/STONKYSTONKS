name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests & security scans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check formatting (ruff)
        run: ruff format --check .

      - name: Unit tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Static security scan (bandit)
        run: bandit --quiet --severity-level medium --confidence-level medium --recursive scripts

      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit --requirement requirements.txt

  container:
    name: Container image (build & test stage)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Building the `test` target lints, security-scans and runs the whole
      # unit suite inside the exact environment that ships.
      - name: Build test stage
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          push: false
          tags: stonkystonks:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
